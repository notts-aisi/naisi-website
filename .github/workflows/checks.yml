# Every pull request gets the same four checks a change has to pass locally.
#
# The BUILD is the point of this file. Typecheck, lint and the node suites all
# pass on code that cannot be bundled: Next enforces the client and server
# boundary at build time and nowhere else, so a module that reaches
# `server-only` from a client component is green everywhere except here. Before
# this workflow the only build that ever ran was the App Hosting rollout, which
# means a build error was discovered by a failed deploy.
name: Checks

on:
  # Every pull request, whatever it targets. Work that lands on `dev` as one
  # change is often assembled on a staging branch first, and those pull
  # requests need the same checks as the one that finally opens against `dev`.
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Neither job writes to the repository or calls the API: they check out the
# code and run it. So the token each job is handed can only read contents,
# and a compromised dependency running in `npm ci` gets nothing more.
permissions:
  contents: read

jobs:
  app:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      # Every line is chopped before the runner reads it. The runner handles
      # output a line at a time and stalled for minutes on a single line: a
      # stack trace whose frames were the test loader's data: URLs, each
      # carrying a whole module source, 440 KB per line, 30 of this job's 33
      # minutes on 2026-09-06 against 10 seconds for the same command on a
      # laptop. tests/lib/outputGuard.mjs now fails any test file that prints
      # a line over 20 KB, so the suite should never produce one again; the
      # cut stays as the backstop for a line the guard does not see. pipefail
      # keeps the tests' exit status rather than cut's.
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | cut -c 1-4000
      # A build needs the public Firebase values to inline. They are public by
      # definition (they ship in the browser bundle), and a build does not
      # contact the project, so placeholders are enough to prove it compiles.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"
          NEXT_PUBLIC_APP_URL: https://example.invalid

  rules:
    name: Firestore and Storage rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      # The emulator suite is a Java process. 21, because firebase-tools 15
      # refuses anything older and the version it replaces runs on 21 as well.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm ci
        working-directory: scripts/rules-tests
      - run: npm test
        working-directory: scripts/rules-tests
