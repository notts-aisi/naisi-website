# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  timeoutSeconds: 60

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: naisi-web-api-key
    availability: [BUILD, RUNTIME]
  # Firebase Hosting custom domain serving the OAuth handler at
  # /__/auth/handler/*. Serving from auth.naisi.uk (same eTLD+1 as naisi.uk)
  # keeps Firebase auth cookies first-party → Safari ITP doesn't block them →
  # popup sign-in works reliably. Dev overrides this to auth-dev.naisi.uk
  # via the App Hosting console UI.
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: auth.naisi.uk
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: naisi-website
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: naisi-website.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: naisi-web-messaging-sender-id
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: naisi-web-app-id
    availability: [BUILD, RUNTIME]
  # OAuth 2.0 client ID for Google Identity Services. Required by the GSI
  # button initializer (google.accounts.id.initialize). One client ID per
  # Firebase project — the dev backend overrides this with its own ID via
  # the App Hosting console UI. Public by design (ships in the client
  # bundle), no Secret Manager indirection needed.
  - variable: NEXT_PUBLIC_GOOGLE_CLIENT_ID
    value: 742980551273-h0p1c9kmff5tdoe32rm2d10ia2iht4k1.apps.googleusercontent.com
    availability: [BUILD, RUNTIME]
  # HMAC secret used to sign RSVP self-cancel / change-request links in emails.
  # Rotating the secret invalidates every outstanding email link.
  - variable: EVENTS_TOKEN_SECRET
    secret: EVENTS_TOKEN_SECRET
    availability: [RUNTIME]
  # Resend SMTP (eu-west-1). Migrated off AWS SES 2026-04-22 after T&S denied
  # production access. SMTP_USER is literally the string "resend" for every
  # Resend account; SMTP_PASSWORD is an account-scoped API key stored per
  # project in Secret Manager. DKIM signs d=naisi.uk via resend._domainkey,
  # so SMTP_FROM_EMAIL on @naisi.uk preserves DMARC alignment.
  - variable: SMTP_HOST
    value: smtp.resend.com
    availability: [RUNTIME]
  - variable: SMTP_PORT
    value: "587"
    availability: [RUNTIME]
  - variable: SMTP_USER
    value: resend
    availability: [RUNTIME]
  - variable: SMTP_PASSWORD
    secret: SMTP_PASSWORD
    availability: [RUNTIME]
  # Svix-style signing secret issued by Resend per webhook endpoint. Each env
  # has its own endpoint URL and therefore its own secret value in that
  # project's Secret Manager.
  - variable: RESEND_WEBHOOK_SECRET
    secret: RESEND_WEBHOOK_SECRET
    availability: [RUNTIME]
  # Bearer token Cloud Scheduler presents to POST /api/scheduler/tick, read in
  # src/app/api/scheduler/tick/route.ts. RUNTIME only and never NEXT_PUBLIC_:
  # a build-time value would be inlined into the client bundle. The secret is
  # minted per project (docs/courses-ops.md, "The scheduler tick"); a backend
  # whose Secret Manager lacks it fails its rollout on this line, which is the
  # intended failure: a tick with no secret would 404 forever and silently.
  - variable: SCHEDULER_SECRET
    secret: SCHEDULER_SECRET
    availability: [RUNTIME]
  # reCAPTCHA PRIVATE key, used only by lib/recaptcha/server.ts to validate the
  # browser's token via Google siteverify. RUNTIME only — it must never be
  # bundled. Resolved by NAME from each project's own Secret Manager, so prod
  # and dev pull their own key pair without a yaml difference.
  #
  # Was previously a PLAINTEXT env var set in the Firebase console on both
  # backends, which meant anyone with Cloud Run or console read access could
  # read it and it appeared in any `gcloud run services describe` output.
  #
  # The PUBLIC half (NEXT_PUBLIC_RECAPTCHA_SITE_KEY) deliberately stays a
  # console var: it differs per project and is meant to ship in the client
  # bundle, so it needs BUILD availability and has nothing to hide.
  #
  # NOTE console values override this file, so this line stays inert until the
  # plaintext console var is removed from each backend — which is the safe
  # ordering, since nothing changes until that happens.
  - variable: RECAPTCHA_SECRET
    secret: RECAPTCHA_SECRET
    availability: [RUNTIME]
  # Web push (VAPID). Provisioned on BOTH projects 2026-08-29; the secrets
  # resolve by name from each project's own Secret Manager, so dev and prod
  # each run their own keypair with no yaml difference (same pattern as
  # naisi-web-api-key). The PUBLIC key needs BUILD availability because it is
  # inlined into the client bundle; the private key is runtime-only and is
  # what signs each push to the browser vendors' push services. Do NOT
  # reference a secret here before it exists on both projects: an
  # unresolvable secret fails the rollout.
  - variable: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    secret: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    availability: [BUILD, RUNTIME]
  - variable: VAPID_PRIVATE_KEY
    secret: VAPID_PRIVATE_KEY
    availability: [RUNTIME]
  - variable: SMTP_FROM_NAME
    value: NAISI
    availability: [RUNTIME]
  - variable: SMTP_FROM_EMAIL
    value: newsletter@naisi.uk
    availability: [RUNTIME]
  # Absolute base URL baked into outbound email links (unsubscribe, RSVP
  # self-serve). Must match the live origin or links break.
  - variable: NEXT_PUBLIC_APP_URL
    value: https://naisi.uk
    availability: [BUILD, RUNTIME]
  # Default Reply-To header for outbound mail. Set so recipients who hit
  # "Reply" without noticing Reply-To land in a monitored inbox, since the
  # From domain (naisi.uk) has no receiving MX during the SES trust-build phase.
  - variable: EMAIL_DEFAULT_REPLY_TO
    value: ai-safety@uonsu.com
    availability: [RUNTIME]
  # When "true", newsletter sends ignore self-declared university addresses
  # and deliver only to Google-authenticated primary addresses. First-phase
  # reputation-build flag — flip to "false" once suppression pipeline has
  # accumulated enough history to tolerate uni-email bounces.
  - variable: EMAIL_GMAIL_ONLY_MODE
    value: "true"
    availability: [RUNTIME]
  # NEXT_PUBLIC_BEHOLD_FEED_ID is intentionally NOT declared here. The homepage
  # treats absence as "no feed configured yet" and renders a static
  # "Follow @notts.ai.safety" fallback. When the @notts.ai.safety feed is connected on
  # https://behold.so, set the variable per-backend via the Firebase console
  # UI (App Hosting → Settings → Environment variables) with availability:
  # BUILD,RUNTIME. App Hosting rejects empty-string defaults in this file, so
  # there is no useful placeholder to put here.
  #
  # Admin credentials are injected automatically by App Hosting (ADC),
  # no FIREBASE_ADMIN_* env vars needed in production.
