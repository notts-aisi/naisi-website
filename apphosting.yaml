# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  timeoutSeconds: 60

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: naisi-web-api-key
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: naisi-website.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: naisi-website
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: naisi-website.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: naisi-web-messaging-sender-id
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: naisi-web-app-id
    availability: [BUILD, RUNTIME]
  # HMAC secret used to sign RSVP self-cancel / change-request links in emails.
  # Rotating the secret invalidates every outstanding email link.
  - variable: EVENTS_TOKEN_SECRET
    secret: EVENTS_TOKEN_SECRET
    availability: [RUNTIME]
  # Admin credentials are injected automatically by App Hosting (ADC) —
  # no FIREBASE_ADMIN_* env vars needed in production.
